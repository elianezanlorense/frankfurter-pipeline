# Helm values para o chart oficial apache-airflow/airflow.
#
# Compatibilidade:
#   Airflow: 2.9.1
#   Helm chart: 1.19.0

airflowVersion: "2.9.1"

executor: KubernetesExecutor

images:
  airflow:
    repository: PLACEHOLDER
    tag: PLACEHOLDER
    pullPolicy: IfNotPresent

# Usa a Kubernetes Service Account criada pelo Terraform/manifests.
serviceAccount:
  create: false
  name: airflow

# Sincroniza as DAGs diretamente do repositório.
dags:
  gitSync:
    enabled: true
    repo: ssh://git@github.com/elianezanlorense/frankfurter-pipeline.git
    branch: main
    subPath: "airflow/dags"
    sshKeySecret: airflow-git-ssh
    period: 30s
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# PostgreSQL utilizado como banco de metadados do Airflow.
postgresql:
  enabled: true

  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql

  primary:
    resources:
      requests:
        cpu: 50m
        memory: 200Mi
      limits:
        cpu: 500m
        memory: 512Mi

# Interface web do Airflow.
webserver:
  serviceAccount:
    create: false
    name: airflow

  resources:
    requests:
      cpu: 50m
      memory: 400Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # O webserver estava sendo reiniciado depois de apenas 60 segundos.
  # Agora ele terá até aproximadamente 5 minutos para iniciar.
  startupProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 45
    failureThreshold: 30
    periodSeconds: 10
    scheme: HTTP

  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 45
    failureThreshold: 12
    periodSeconds: 10
    scheme: HTTP

  livenessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 45
    failureThreshold: 12
    periodSeconds: 10
    scheme: HTTP

  service:
    type: LoadBalancer

# Scheduler principal do Airflow.
scheduler:
  serviceAccount:
    create: false
    name: airflow

  resources:
    requests:
      cpu: 50m
      memory: 300Mi
    limits:
      cpu: "1"
      memory: 768Mi

  startupProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 45
    failureThreshold: 30
    periodSeconds: 10

  livenessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 45
    failureThreshold: 12
    periodSeconds: 20

# Triggerer utilizado por tarefas deferrable.
triggerer:
  serviceAccount:
    create: false
    name: airflow

  resources:
    requests:
      cpu: 30m
      memory: 200Mi
    limits:
      cpu: 500m
      memory: 512Mi

  livenessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 45
    failureThreshold: 12
    periodSeconds: 20

  persistence:
    enabled: true
    size: 10Gi

# Coleta de métricas do Airflow — desativado para economizar CPU no trial.
statsd:
  enabled: false

# Importa as variáveis do ConfigMap criado no workflow.
extraEnvFrom: |
  - configMapRef:
      name: airflow-pipeline-config

config:
  core:
    load_examples: "False"

  logging:
    remote_logging: "True"
    remote_log_conn_id: "google_cloud_default"