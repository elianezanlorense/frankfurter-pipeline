# values.yaml para o Helm chart oficial do Apache Airflow.
#
# Compatibilidade:
#   Apache Airflow: 2.9.1
#   Helm chart:     1.19.0
#
# image.repository e image.tag são sobrescritos pelo GitHub Actions
# durante o deployment.

executor: KubernetesExecutor
airflowVersion: "2.9.1"

images:
  airflow:
    repository: PLACEHOLDER
    tag: PLACEHOLDER
    pullPolicy: IfNotPresent

# Usa a Kubernetes Service Account criada pelos manifests do projeto.
# Ela está vinculada à Google Service Account por Workload Identity.
serviceAccount:
  create: false
  name: airflow

# Sincroniza as DAGs a partir do repositório privado no GitHub.
dags:
  gitSync:
    enabled: true
    repo: ssh://git@github.com/elianezanlorense/frankfurter-pipeline.git
    branch: main
    subPath: "airflow/dags"
    sshKeySecret: airflow-git-ssh
    period: 30s

# PostgreSQL incorporado ao Helm chart para armazenar os metadados.
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql

# Reduz o volume persistente do triggerer.
# O padrão de 100 GiB excedia a quota disponível no projeto.
triggerer:
  persistence:
    enabled: true
    size: 10Gi

# ConfigMap com as variáveis utilizadas pelas DAGs:
# GCP_PROJECT_ID, GCS_BUCKET e BQ_DATASET.
extraEnvFrom: |
  - configMapRef:
      name: airflow-pipeline-config

# Desativa as DAGs de demonstração incluídas no Airflow.
config:
  core:
    load_examples: "False"

# Expõe a interface web do Airflow por meio de um LoadBalancer.
webserver:
  service:
    type: LoadBalancer