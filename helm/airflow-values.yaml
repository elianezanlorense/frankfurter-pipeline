# values.yaml para o Helm chart oficial do Airflow.
# Este arquivo usa o chart 1.19.0, compatível com Airflow 2.9.1.
# https://airflow.apache.org/docs/helm-chart/1.19.0/parameters-ref.html
#
# image.repository e image.tag são sobrescritos via --set no CI, apontando
# para a imagem construída e publicada no Artifact Registry.

executor: KubernetesExecutor
airflowVersion: "2.9.1"

images:
  airflow:
    repository: PLACEHOLDER # sobrescrito via --set no CI
    tag: PLACEHOLDER        # sobrescrito via --set no CI
    pullPolicy: IfNotPresent

# Usa a KSA "airflow" que o Terraform e os manifests Kubernetes já criaram
# e vincularam via Workload Identity à service account do Google Cloud.
serviceAccount:
  create: false
  name: airflow

# As DAGs vêm do próprio repositório por meio do git-sync.
# Somente a subpasta airflow/dags é utilizada.
dags:
  gitSync:
    enabled: true
    repo: ssh://git@github.com/elianezanlorense/frankfurter-pipeline.git
    branch: main
    subPath: "airflow/dags"
    sshKeySecret: airflow-git-ssh
    period: 30s

# Banco de metadados PostgreSQL incorporado ao chart.
# Adequado para desenvolvimento e projetos pequenos.
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql

# O valor padrão do chart é 100 GiB.
# Para este projeto, 10 GiB são suficientes para os logs do triggerer.
triggerer:
  persistence:
    enabled: true
    size: 10Gi

# Variáveis de ambiente utilizadas pelas DAGs.
# O ConfigMap deve fornecer GCP_PROJECT_ID, GCS_BUCKET e BQ_DATASET.
extraEnvFrom: |
  - configMapRef:
      name: airflow-pipeline-config

# Desativa as DAGs de exemplo.
config:
  core:
    load_examples: "False"

# Expõe a interface web do Airflow por meio de um LoadBalancer.
webserver:
  service:
    type: LoadBalancer