# values.yaml para o Helm chart oficial do Airflow (apache-airflow/airflow).
# https://airflow.apache.org/docs/helm-chart/stable/parameters-ref.html
#
# image.repository e image.tag são sobrescritos via --set no CI, apontando
# para a imagem que acabou de ser buildada/publicada no Artifact Registry.

executor: KubernetesExecutor

images:
  airflow:
    repository: PLACEHOLDER # sobrescrito via --set no CI
    tag: PLACEHOLDER        # sobrescrito via --set no CI
    pullPolicy: IfNotPresent

# Usa a KSA "airflow" que o Terraform + k8s-namespace-sa.yaml já criaram e
# vincularam via Workload Identity à service account do GCP (airflow-gke-sa).
# create: false porque a KSA já existe.
serviceAccount:
  create: false
  name: airflow

# DAGs vêm do próprio repositório via git-sync, puxando somente a subpasta
# airflow/dags. Isso evita reconstruir a imagem quando uma DAG é alterada.
dags:
  gitSync:
    enabled: true
    repo: ssh://git@github.com/elianezanlorense/frankfurter-pipeline.git
    branch: main
    subPath: "airflow/dags"
    sshKeySecret: airflow-git-ssh
    period: 30s

# Banco de metadados: usa o PostgreSQL embutido no chart.
# Para um ambiente maior, considerar migração para Cloud SQL.
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql

# O chart cria por padrão um volume de 100 GiB para o triggerer.
# Para este projeto, 10 GiB são suficientes e evitam exceder a quota SSD.
triggerer:
  persistence:
    enabled: true
    size: 10Gi

# Variáveis de ambiente utilizadas pelas DAGs.
# O ConfigMap deve conter GCP_PROJECT_ID, GCS_BUCKET e BQ_DATASET.
extraEnvFrom: |
  - configMapRef:
      name: airflow-pipeline-config

# Desativa as DAGs de exemplo.
config:
  core:
    load_examples: "False"

# Expõe a interface do Airflow por meio de um LoadBalancer.
webserver:
  service:
    type: LoadBalancer