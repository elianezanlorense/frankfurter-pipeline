# values.yaml para o Helm chart oficial do Airflow.
# https://airflow.apache.org/docs/helm-chart/stable/parameters-ref.html
#
# O repository e a tag da imagem são sobrescritos pelo workflow durante
# o helm upgrade.

# ---------------------------------------------------------------------------
# Executor
# ---------------------------------------------------------------------------

executor: KubernetesExecutor

# ---------------------------------------------------------------------------
# Imagem customizada do Airflow
# ---------------------------------------------------------------------------

images:
  airflow:
    repository: PLACEHOLDER
    tag: PLACEHOLDER
    pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Migrations e criação do usuário
#
# Como o workflow utiliza "helm upgrade --wait", esses jobs são criados como
# recursos normais do release, em vez de Helm hooks.
# ---------------------------------------------------------------------------

createUserJob:
  useHelmHooks: false
  applyCustomEnv: false

migrateDatabaseJob:
  enabled: true
  useHelmHooks: false
  applyCustomEnv: false

# ---------------------------------------------------------------------------
# Kubernetes Service Account
#
# A KSA airflow é criada pelo arquivo k8s/namespace-sa.yaml e vinculada à
# Google Service Account airflow-gke-sa por Workload Identity.
# ---------------------------------------------------------------------------

serviceAccount:
  create: false
  name: airflow

# ---------------------------------------------------------------------------
# DAGs
#
# O repositório é público, portanto o git-sync utiliza HTTPS e não precisa
# de chave SSH.
# ---------------------------------------------------------------------------

dags:
  gitSync:
    enabled: true
    repo: https://github.com/elianezanlorense/frankfurter-pipeline.git
    branch: main
    rev: HEAD
    subPath: airflow/dags
    period: 30s

# ---------------------------------------------------------------------------
# Banco de metadados
# ---------------------------------------------------------------------------

postgresql:
  enabled: true

# Redis não é necessário com KubernetesExecutor.
redis:
  enabled: false

# ---------------------------------------------------------------------------
# Variáveis utilizadas pelas DAGs
#
# O chart valida "env" aceitando apenas name/value. Para utilizar valueFrom
# com ConfigMap, é necessário usar extraEnv como bloco YAML templado.
# ---------------------------------------------------------------------------

extraEnv: |
  - name: GCP_PROJECT_ID
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: GCP_PROJECT_ID

  - name: GCS_BUCKET
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: GCS_BUCKET

  - name: BQ_DATASET
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: BQ_DATASET

# ---------------------------------------------------------------------------
# Configuração do Airflow
# ---------------------------------------------------------------------------

config:
  core:
    load_examples: "False"

# ---------------------------------------------------------------------------
# API Server / interface web
#
# Nas versões atuais do Airflow, a interface é exposta pelo API Server.
# ---------------------------------------------------------------------------

apiServer:
  service:
    type: LoadBalancer