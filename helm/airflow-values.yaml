# values.yaml para o Helm chart oficial do Airflow (apache-airflow/airflow).
# https://airflow.apache.org/docs/helm-chart/stable/parameters-ref.html
#
# image.repository e image.tag são sobrescritos via --set no CI, apontando
# para a imagem que acabou de ser buildada/publicada no Artifact Registry.
executor: KubernetesExecutor

images:
  airflow:
    repository: PLACEHOLDER # sobrescrito via --set no CI
    tag: PLACEHOLDER        # sobrescrito via --set no CI
    pullPolicy: IfNotPresent

# Usa a KSA "airflow" que o Terraform + k8s-namespace-sa.yaml já criaram e
# vincularam via Workload Identity à service account do GCP (airflow-gke-sa).
# create: false porque a KSA já existe (não deixamos o Helm criar outra).
serviceAccount:
  create: false
  name: airflow

# DAGs vêm do próprio repositório via git-sync, puxando só a subpasta
# airflow/dags a cada poucos segundos — evita precisar rebuildar a imagem
# toda vez que uma DAG muda.
dags:
  gitSync:
    enabled: true
    repo: ssh://git@github.com/elianezanlorense/frankfurter-pipeline.git
    branch: main
    subPath: "airflow/dags"
    sshKeySecret: airflow-git-ssh
    period: 30s

# Banco de metadados: usa o Postgres embutido no próprio chart (padrão).
# Suficiente para esse volume de uso; se crescer, migrar para Cloud SQL.
#
# NOTA: a Bitnami (dona da imagem padrão do subchart de postgresql) moveu a
# maior parte do catálogo público para o repositório "bitnamilegacy" a
# partir de 2025 — a tag antiga que o chart do Airflow referenciava por
# padrão (bitnami/postgresql) some do ar e causa ImagePullBackOff. Apontamos
# explicitamente para bitnamilegacy para continuar funcionando sem custo.
postgresql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql

# Variáveis de ambiente que as DAGs esperam (frankfurter_dag.py lê
# GCP_PROJECT_ID, GCS_BUCKET, BQ_DATASET via os.environ).
env:
  - name: GCP_PROJECT_ID
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: GCP_PROJECT_ID
  - name: GCS_BUCKET
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: GCS_BUCKET
  - name: BQ_DATASET
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: BQ_DATASET

# Exemplos de DAG desligados (não precisamos deles poluindo a UI).
config:
  core:
    load_examples: 'False'

# Webserver exposto via LoadBalancer para acesso simples à UI. Ajustar para
# Ingress + TLS depois, se quiser algo mais robusto/seguro.
webserver:
  service:
    type: LoadBalancer