# values.yaml para o Helm chart oficial do Airflow.
# Configurado para a imagem apache/airflow:2.9.1-python3.11.

# ---------------------------------------------------------------------------
# Versão e executor
# ---------------------------------------------------------------------------

airflowVersion: "2.9.1"

executor: KubernetesExecutor

# ---------------------------------------------------------------------------
# Imagem
#
# repository e tag são sobrescritos pelo workflow.
# ---------------------------------------------------------------------------

images:
  airflow:
    repository: PLACEHOLDER
    tag: PLACEHOLDER
    pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Migrations
# ---------------------------------------------------------------------------

createUserJob:
  useHelmHooks: false
  applyCustomEnv: false

migrateDatabaseJob:
  enabled: true
  useHelmHooks: false
  applyCustomEnv: false

# ---------------------------------------------------------------------------
# Kubernetes Service Account
# ---------------------------------------------------------------------------

serviceAccount:
  create: false
  name: airflow

# ---------------------------------------------------------------------------
# DAGs
# ---------------------------------------------------------------------------

dags:
  persistence:
    enabled: false

  gitSync:
    enabled: true
    repo: https://github.com/elianezanlorense/frankfurter-pipeline.git
    branch: main
    rev: HEAD
    subPath: airflow/dags
    period: 30s

# ---------------------------------------------------------------------------
# Banco de metadados
# ---------------------------------------------------------------------------

postgresql:
  enabled: true

# KubernetesExecutor não precisa de Redis.
redis:
  enabled: false

# ---------------------------------------------------------------------------
# Persistência
#
# Para este ambiente dev, os logs utilizam emptyDir. Isso evita a criação
# de discos de 100 GiB que estava excedendo a quota SSD_TOTAL_GB.
# ---------------------------------------------------------------------------

logs:
  persistence:
    enabled: false

workers:
  persistence:
    enabled: false

triggerer:
  persistence:
    enabled: false

# ---------------------------------------------------------------------------
# Variáveis das DAGs
# ---------------------------------------------------------------------------

extraEnv: |
  - name: GCP_PROJECT_ID
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: GCP_PROJECT_ID

  - name: GCS_BUCKET
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: GCS_BUCKET

  - name: BQ_DATASET
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: BQ_DATASET

# ---------------------------------------------------------------------------
# Configuração do Airflow
# ---------------------------------------------------------------------------

config:
  core:
    load_examples: "False"

# ---------------------------------------------------------------------------
# Interface web
#
# Airflow 2 utiliza webserver. O recurso apiServer é do Airflow 3.
# ---------------------------------------------------------------------------

webserver:
  enabled: true

  service:
    type: LoadBalancer