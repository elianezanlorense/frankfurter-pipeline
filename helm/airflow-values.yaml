# Helm values para o chart oficial apache-airflow/airflow.
#
# Compatibilidade:
#   Airflow: 2.9.1
#   Helm chart: 1.19.0

airflowVersion: "2.9.1"

executor: KubernetesExecutor

images:
  airflow:
    repository: PLACEHOLDER
    tag: PLACEHOLDER
    pullPolicy: IfNotPresent

# Usa a Kubernetes Service Account criada pelo Terraform/manifests.
serviceAccount:
  create: false
  name: airflow

# Sincroniza as DAGs diretamente do repositório.
dags:
  gitSync:
    enabled: true
    repo: ssh://git@github.com/elianezanlorense/frankfurter-pipeline.git
    branch: main
    subPath: "airflow/dags"
    sshKeySecret: airflow-git-ssh
    period: 30s

# PostgreSQL utilizado como banco de metadados do Airflow.
postgresql:
  enabled: true

  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql

# Interface web do Airflow.
webserver:
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  # O webserver estava sendo reiniciado depois de apenas 60 segundos.
  # Agora ele terá até aproximadamente 5 minutos para iniciar.
  startupProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 20
    failureThreshold: 30
    periodSeconds: 10
    scheme: HTTP

  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 10
    failureThreshold: 12
    periodSeconds: 10
    scheme: HTTP

  livenessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 10
    failureThreshold: 6
    periodSeconds: 10
    scheme: HTTP

  service:
    type: LoadBalancer

# Scheduler principal do Airflow.
scheduler:
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi

  startupProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 20
    failureThreshold: 30
    periodSeconds: 10

  livenessProbe:
    initialDelaySeconds: 60
    timeoutSeconds: 20
    failureThreshold: 6
    periodSeconds: 20

# Triggerer utilizado por tarefas deferrable.
triggerer:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  persistence:
    enabled: true
    size: 10Gi

# Coleta de métricas do Airflow.
statsd:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Importa as variáveis do ConfigMap criado no workflow.
extraEnvFrom: |
  - configMapRef:
      name: airflow-pipeline-config

config:
  core:
    load_examples: "False"

  logging:
    remote_logging: "True"
    remote_log_conn_id: "google_cloud_default"