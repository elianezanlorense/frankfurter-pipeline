# Helm values para o chart oficial apache-airflow/airflow.
# Compatível com:
#   Airflow: 2.9.1
#   Helm chart: 1.19.0

airflowVersion: "2.9.1"

executor: KubernetesExecutor

images:
  airflow:
    repository: PLACEHOLDER
    tag: PLACEHOLDER
    pullPolicy: IfNotPresent

serviceAccount:
  create: false
  name: airflow

dags:
  gitSync:
    enabled: true
    repo: ssh://git@github.com/elianezanlorense/frankfurter-pipeline.git
    branch: main
    subPath: "airflow/dags"
    sshKeySecret: airflow-git-ssh
    period: 30s

postgresql:
  enabled: true

  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql

webserver:
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi

  service:
    type: LoadBalancer

scheduler:
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: "1"
      memory: 1536Mi

triggerer:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  persistence:
    enabled: true
    size: 10Gi

statsd:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

extraEnvFrom: |
  - configMapRef:
      name: airflow-pipeline-config

config:
  core:
    load_examples: "False"

  logging:
    remote_logging: "True"
    remote_log_conn_id: "google_cloud_default"