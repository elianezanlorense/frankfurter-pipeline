# values.yaml para o Helm chart oficial do Airflow.
# Compatível com apache/airflow:2.9.1-python3.11.

# ---------------------------------------------------------------------------
# Versão e executor
# ---------------------------------------------------------------------------

airflowVersion: "2.9.1"

executor: KubernetesExecutor

# ---------------------------------------------------------------------------
# Imagem
#
# O repository e a tag são sobrescritos pelo workflow.
# ---------------------------------------------------------------------------

images:
  airflow:
    repository: PLACEHOLDER
    tag: PLACEHOLDER
    pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Migrations e usuário administrativo
#
# Como o workflow usa helm upgrade --wait, esses jobs são recursos normais
# do release, em vez de Helm hooks.
# ---------------------------------------------------------------------------

createUserJob:
  useHelmHooks: false
  applyCustomEnv: false

migrateDatabaseJob:
  enabled: true
  useHelmHooks: false
  applyCustomEnv: false

# ---------------------------------------------------------------------------
# Kubernetes Service Account
#
# Criada previamente por k8s/namespace-sa.yaml e vinculada à Google Service
# Account airflow-gke-sa por Workload Identity.
# ---------------------------------------------------------------------------

serviceAccount:
  create: false
  name: airflow

# ---------------------------------------------------------------------------
# DAGs
#
# O repositório é público, portanto utiliza HTTPS e não precisa de Secret SSH.
# ---------------------------------------------------------------------------

dags:
  persistence:
    enabled: false

  gitSync:
    enabled: true
    repo: https://github.com/elianezanlorense/frankfurter-pipeline.git
    branch: main
    rev: HEAD
    subPath: airflow/dags
    period: 30s

# ---------------------------------------------------------------------------
# Banco de metadados
# ---------------------------------------------------------------------------

postgresql:
  enabled: true

# KubernetesExecutor não precisa de Redis.
redis:
  enabled: false

# ---------------------------------------------------------------------------
# Persistência
#
# Em desenvolvimento, utiliza volumes temporários para evitar consumo
# desnecessário da quota regional de SSD.
# ---------------------------------------------------------------------------

logs:
  persistence:
    enabled: false

workers:
  persistence:
    enabled: false

triggerer:
  persistence:
    enabled: false

# ---------------------------------------------------------------------------
# Variáveis utilizadas pelas DAGs
#
# O ConfigMap airflow-pipeline-config é criado pelo workflow antes do Helm.
# ---------------------------------------------------------------------------

extraEnv: |
  - name: GCP_PROJECT_ID
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: GCP_PROJECT_ID

  - name: GCS_BUCKET
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: GCS_BUCKET

  - name: BQ_DATASET
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: BQ_DATASET

# ---------------------------------------------------------------------------
# Configuração do Airflow
# ---------------------------------------------------------------------------

config:
  core:
    load_examples: "False"

# ---------------------------------------------------------------------------
# Interface web
#
# Airflow 2.9.1 utiliza airflow webserver, não airflow api-server.
# ---------------------------------------------------------------------------

webserver:
  enabled: true

  service:
    type: LoadBalancer