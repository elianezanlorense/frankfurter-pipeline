# values.yaml para o Helm chart oficial do Apache Airflow.
#
# Imagem Airflow:
#   apache/airflow:2.9.1-python3.11
#
# Helm chart:
#   apache-airflow/airflow 1.16.0

# ---------------------------------------------------------------------------
# Airflow
# ---------------------------------------------------------------------------

airflowVersion: "2.9.1"

executor: KubernetesExecutor

# ---------------------------------------------------------------------------
# Imagem customizada
#
# Repository e tag são sobrescritos pelo workflow.
# ---------------------------------------------------------------------------

images:
  airflow:
    repository: PLACEHOLDER
    tag: PLACEHOLDER
    pullPolicy: IfNotPresent

  useDefaultImageForMigration: false

  migrationsWaitTimeout: 300

# ---------------------------------------------------------------------------
# Jobs de inicialização
# ---------------------------------------------------------------------------

createUserJob:
  useHelmHooks: false
  applyCustomEnv: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

migrateDatabaseJob:
  enabled: true
  useHelmHooks: false
  applyCustomEnv: false

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ---------------------------------------------------------------------------
# DAGs
#
# Repositório público: utiliza HTTPS e não precisa de Secret SSH.
# ---------------------------------------------------------------------------

dags:
  persistence:
    enabled: false

  gitSync:
    enabled: true
    repo: https://github.com/elianezanlorense/frankfurter-pipeline.git
    branch: main
    ref: main
    rev: HEAD
    subPath: airflow/dags
    period: 30s

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ---------------------------------------------------------------------------
# PostgreSQL
#
# A imagem originalmente usada pelo subchart foi removida do repositório
# principal da Bitnami. O repositório bitnamilegacy é um fallback temporário.
# ---------------------------------------------------------------------------

postgresql:
  enabled: true

  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.1.0-debian-11-r15
    pullPolicy: IfNotPresent

  primary:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

    persistence:
      enabled: true
      size: 8Gi

# ---------------------------------------------------------------------------
# Redis e StatsD
#
# Não são necessários para este ambiente com KubernetesExecutor.
# ---------------------------------------------------------------------------

redis:
  enabled: false

statsd:
  enabled: false

# ---------------------------------------------------------------------------
# Logs
#
# Usa emptyDir para evitar volumes de logs de 100 GiB e estouro da quota SSD.
# ---------------------------------------------------------------------------

logs:
  persistence:
    enabled: false

# ---------------------------------------------------------------------------
# Scheduler
# ---------------------------------------------------------------------------

scheduler:
  enabled: true
  replicas: 1

  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 1Gi

  waitForMigrations:
    enabled: false

  serviceAccount:
    create: false
    name: airflow

  logGroomerSidecar:
    enabled: false

    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

# ---------------------------------------------------------------------------
# Webserver — Airflow 2
# ---------------------------------------------------------------------------

webserver:
  enabled: true
  replicas: 1

  strategy:
    type: Recreate

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 1Gi

  waitForMigrations:
    enabled: false

  serviceAccount:
    create: false
    name: airflow

  service:
    type: LoadBalancer

# ---------------------------------------------------------------------------
# Triggerer
#
# Desabilitado neste ambiente dev. Ele é necessário apenas para operadores
# deferrable e não é necessário para a pipeline atual.
# ---------------------------------------------------------------------------

triggerer:
  enabled: false

  persistence:
    enabled: false

# ---------------------------------------------------------------------------
# Workers criados dinamicamente pelo KubernetesExecutor
# ---------------------------------------------------------------------------

workers:
  persistence:
    enabled: false

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

  serviceAccount:
    create: false
    name: airflow

# ---------------------------------------------------------------------------
# DAG processor
#
# No Airflow 2.9.1, o scheduler pode processar as DAGs diretamente.
# ---------------------------------------------------------------------------

dagProcessor:
  enabled: false

# ---------------------------------------------------------------------------
# Variáveis utilizadas pelas DAGs
# ---------------------------------------------------------------------------

extraEnv: |
  - name: GCP_PROJECT_ID
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: GCP_PROJECT_ID

  - name: GCS_BUCKET
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: GCS_BUCKET

  - name: BQ_DATASET
    valueFrom:
      configMapKeyRef:
        name: airflow-pipeline-config
        key: BQ_DATASET

# ---------------------------------------------------------------------------
# Configuração do Airflow
# ---------------------------------------------------------------------------

config:
  core:
    load_examples: "False"

  metrics:
    statsd_on: "False"