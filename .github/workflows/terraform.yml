name: Terraform CI

on:
  workflow_call:

permissions:
  contents: read
  id-token: write   # obrigatório: permite gerar o token OIDC usado pelo WIF

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform/infra

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Terraform Init
        run: |
          terraform init \
            -reconfigure \
            -backend-config="bucket=${GCP_PROJECT_ID}-tf-state"

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="terraform.tfvars" \
            -var="project_id=${GCP_PROJECT_ID}" \
            -no-color \
            | tee plan_output.txt

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          terraform apply \
            -auto-approve \
            -var-file="terraform.tfvars" \
            -var="project_id=${GCP_PROJECT_ID}" \
            -no-color \
            | tee apply_output.txt

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Terraform — resumo"
            echo ""
            echo "**Projeto:** \`${GCP_PROJECT_ID}\`"
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo ""
            if [[ -f plan_output.txt ]]; then
              echo "<details><summary>terraform plan (clique para expandir)</summary>"
              echo ""
              echo '```'
              tail -n 60 plan_output.txt
              echo '```'
              echo "</details>"
            fi
            if [[ -f apply_output.txt ]]; then
              echo ""
              echo "<details><summary>terraform apply (clique para expandir)</summary>"
              echo ""
              echo '```'
              tail -n 60 apply_output.txt
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"