# .github/workflows/dbt.yml
name: dbt CI

on:
  workflow_call:

permissions:
  contents: read
  id-token: write   # obrigatório para o WIF gerar o token OIDC

jobs:
  dbt:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dbt

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-bigquery

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          export_environment_variables: true

      - name: Setup dbt profiles
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          zoocamp_project:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: ${{ vars.GCP_PROJECT_ID }}
                dataset: frankfurter_dev
                location: EU
                threads: 4
          EOF

      - name: dbt deps
        run: dbt deps

      - name: dbt compile
        run: dbt compile

      # ---------------------------------------------------------------------
      # Build + push da imagem Docker do dbt, usada pelo KubernetesPodOperator
      # do Airflow. Só roda na main (mesma lógica do terraform apply): validar
      # em qualquer branch, mas só publicar imagem de verdade após o merge.
      # ---------------------------------------------------------------------
      - name: Setup gcloud
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        if: github.ref == 'refs/heads/main'
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build dbt image
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE="europe-west1-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/dbt:${{ github.sha }}"
          docker build -t "$IMAGE" -t "europe-west1-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/dbt:latest" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push dbt image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE"
          docker push "europe-west1-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/dbt:latest"