name: dbt CI

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  dbt:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dbt

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          pip install dbt-bigquery

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          export_environment_variables: true

      - name: Setup dbt profiles
        run: |
          mkdir -p ~/.dbt

          cat > ~/.dbt/profiles.yml << EOF
          zoocamp_project:
            target: dev
            outputs:
              dev:
                type: bigquery
                method: oauth
                project: ${GCP_PROJECT_ID}
                dataset: frankfurter_dev
                location: EU
                threads: 4
          EOF

      - name: Install dbt dependencies
        run: |
          dbt deps

      - name: Compile dbt project
        run: |
          dbt compile

      - name: Setup gcloud
        if: github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Discover GCP resource locations
        if: github.ref == 'refs/heads/main'
        run: |
          GKE_LOCATION="$(
            gcloud container clusters list \
              --project "$GCP_PROJECT_ID" \
              --filter="name=${GCP_PROJECT_ID}-airflow-gke" \
              --format="value(location)" \
              --limit=1
          )"

          if [[ -z "$GKE_LOCATION" ]]; then
            echo "Could not discover the GKE cluster location." >&2
            exit 1
          fi

          if [[ "$GKE_LOCATION" =~ -[a-z]$ ]]; then
            ARTIFACT_REGION="${GKE_LOCATION%-*}"
          else
            ARTIFACT_REGION="$GKE_LOCATION"
          fi

          echo "GKE_LOCATION=$GKE_LOCATION" >> "$GITHUB_ENV"
          echo "ARTIFACT_REGION=$ARTIFACT_REGION" >> "$GITHUB_ENV"

          echo "GKE location: $GKE_LOCATION"
          echo "Artifact Registry region: $ARTIFACT_REGION"

      - name: Configure Docker for Artifact Registry
        if: github.ref == 'refs/heads/main'
        run: |
          gcloud auth configure-docker \
            "${ARTIFACT_REGION}-docker.pkg.dev" \
            --quiet

      - name: Build dbt image
        if: github.ref == 'refs/heads/main'
        run: |
          IMAGE_BASE="${ARTIFACT_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/dbt"
          IMAGE_SHA="${IMAGE_BASE}:${{ github.sha }}"
          IMAGE_LATEST="${IMAGE_BASE}:latest"

          docker build \
            -t "$IMAGE_SHA" \
            -t "$IMAGE_LATEST" \
            .

          echo "DBT_IMAGE_SHA=$IMAGE_SHA" >> "$GITHUB_ENV"
          echo "DBT_IMAGE_LATEST=$IMAGE_LATEST" >> "$GITHUB_ENV"

      - name: Push dbt image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "$DBT_IMAGE_SHA"
          docker push "$DBT_IMAGE_LATEST"

      - name: Write dbt summary
        if: always()
        run: |
          {
            echo "## dbt CI — summary"
            echo ""
            echo "**Project:** \`${GCP_PROJECT_ID}\`"
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo "**GKE location:** \`${GKE_LOCATION:-not discovered}\`"
            echo "**Artifact region:** \`${ARTIFACT_REGION:-not discovered}\`"
            echo "**Commit image:** \`${DBT_IMAGE_SHA:-not published}\`"
            echo "**Latest image:** \`${DBT_IMAGE_LATEST:-not published}\`"
          } >> "$GITHUB_STEP_SUMMARY"