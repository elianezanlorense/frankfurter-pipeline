name: Teste GCP Auth

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  test-auth:
    name: Testar autenticação no GCP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Autenticar no GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Instalar gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Verificar autenticação
        run: |
          gcloud auth list \
            --filter="status:ACTIVE" \
            --format="value(account)"

      - name: Verificar projeto
        run: |
          gcloud projects describe "${{ vars.GCP_PROJECT_ID }}" \
            --format="table(projectId,projectNumber,lifecycleState)"

      - name: Testar acesso ao GCS
        run: |
          gcloud storage buckets list \
            --project="${{ vars.GCP_PROJECT_ID }}"