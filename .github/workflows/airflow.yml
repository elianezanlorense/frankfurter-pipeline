name: Airflow CI

on:
  workflow_call:
    secrets:
      SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy-airflow:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ZONE: ${{ vars.GCP_ZONE }}
      USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
      AIRFLOW_VERSION: "2.9.1"
      AIRFLOW_CHART_VERSION: "1.19.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Airflow image
        working-directory: ./airflow
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/airflow:${{ github.sha }}"

          docker build -t "$IMAGE" .

          echo "AIRFLOW_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Verify Airflow version
        run: |
          ACTUAL_VERSION="$(
            docker run --rm "$AIRFLOW_IMAGE" \
              airflow version 2>/dev/null |
              tail -n 1
          )"

          echo "Expected Airflow version: $AIRFLOW_VERSION"
          echo "Actual Airflow version:   $ACTUAL_VERSION"

          if [[ "$ACTUAL_VERSION" != "$AIRFLOW_VERSION" ]]; then
            echo "Airflow image version does not match the configured version." >&2
            exit 1
          fi

      - name: Push Airflow image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "$AIRFLOW_IMAGE"

      - name: Get GKE credentials
        if: github.ref == 'refs/heads/main'
        run: |
          gcloud container clusters get-credentials \
            "${GCP_PROJECT_ID}-airflow-gke" \
            --zone "$ZONE" \
            --project "$GCP_PROJECT_ID"

      # ---------------------------------------------------------------------
      # Cluster é GKE Standard (não Autopilot): o node pool (airflow-pool)
      # é um recurso separado que pode ainda estar provisionando logo após
      # o terraform apply criar o cluster. Sem essa espera, o primeiro
      # deploy depois de criar/recriar o cluster pode falhar porque não há
      # nenhum node pronto para agendar os pods do Airflow.
      # ---------------------------------------------------------------------
      - name: Wait for node pool to be ready
        if: github.ref == 'refs/heads/main'
        run: |
          echo "==> Aguardando node pool 'airflow-pool' ficar RUNNING..."
          for i in $(seq 1 30); do
            STATUS="$(
              gcloud container node-pools describe airflow-pool \
                --cluster "${GCP_PROJECT_ID}-airflow-gke" \
                --zone "$ZONE" \
                --project "$GCP_PROJECT_ID" \
                --format="value(status)" 2>/dev/null || true
            )"
            echo "Tentativa $i/30: status = ${STATUS:-desconhecido}"
            if [[ "$STATUS" == "RUNNING" ]]; then
              break
            fi
            sleep 20
          done

          echo "==> Aguardando ao menos 1 node Ready no cluster..."
          kubectl wait --for=condition=Ready nodes --all --timeout=180s || true

          kubectl get nodes

      - name: Apply namespace and Kubernetes Service Account
        if: github.ref == 'refs/heads/main'
        run: |
          sed "s/PROJECT_ID/${GCP_PROJECT_ID}/" \
            k8s/namespace-sa.yaml |
            kubectl apply -f -

      - name: Create ConfigMap with pipeline variables
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl create configmap airflow-pipeline-config \
            --namespace airflow \
            --from-literal=GCP_PROJECT_ID="${GCP_PROJECT_ID}" \
            --from-literal=GCS_BUCKET="${GCP_PROJECT_ID}-data-lake" \
            --from-literal=BQ_DATASET="frankfurter_dev" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

      - name: Create git-sync SSH secret
        if: github.ref == 'refs/heads/main'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo "GitHub Secret SSH_PRIVATE_KEY is not configured." >&2
            exit 1
          fi

          umask 077

          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"

          kubectl create secret generic airflow-git-ssh \
            --namespace airflow \
            --from-file=gitSshKey="$KEY_FILE" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

      - name: Add Airflow Helm repository
        if: github.ref == 'refs/heads/main'
        run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Deploy Airflow via Helm
        if: github.ref == 'refs/heads/main'
        run: |
          helm upgrade --install airflow apache-airflow/airflow \
            --namespace airflow \
            --create-namespace \
            --version "$AIRFLOW_CHART_VERSION" \
            -f helm/airflow-values.yaml \
            --set images.airflow.repository="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/airflow" \
            --set images.airflow.tag="${{ github.sha }}" \
            --timeout 10m0s \
            2>&1 |
            tee helm_output.txt

      - name: Collect cluster diagnostics
        if: always() && github.ref == 'refs/heads/main'
        run: |
          {
            echo "pods:"
            kubectl get pods -n airflow -o wide

            echo ""
            echo "jobs:"
            kubectl get jobs -n airflow

            echo ""
            echo "PVCs:"
            kubectl get pvc -n airflow

            echo ""
            echo "events (last 20):"
            kubectl get events \
              -n airflow \
              --sort-by='.lastTimestamp' |
              tail -20

            echo ""
            echo "pods that are not ready:"

            for pod in $(
              kubectl get pods \
                -n airflow \
                -o jsonpath='{range .items[?(@.status.containerStatuses[*].ready==false)]}{.metadata.name}{"\n"}{end}' \
                2>/dev/null |
                sort -u
            ); do
              echo "--- $pod ---"
              kubectl describe pod "$pod" -n airflow | tail -40

              echo ""
              echo "init-container logs:"

              for container in $(
                kubectl get pod "$pod" \
                  -n airflow \
                  -o jsonpath='{.spec.initContainers[*].name}' \
                  2>/dev/null
              ); do
                echo "--- $pod / $container ---"

                kubectl logs "$pod" \
                  -n airflow \
                  -c "$container" \
                  --previous 2>/dev/null ||
                  kubectl logs "$pod" \
                    -n airflow \
                    -c "$container" 2>/dev/null ||
                  true
              done
            done
          } > cluster_diagnostics.txt 2>&1 || true

          cat cluster_diagnostics.txt

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Airflow deploy — summary"
            echo ""
            echo "**Project:** \`${GCP_PROJECT_ID}\`"
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo "**Airflow:** \`${AIRFLOW_VERSION}\`"
            echo "**Helm chart:** \`${AIRFLOW_CHART_VERSION}\`"
            echo "**Image:** \`${AIRFLOW_IMAGE:-not built}\`"
            echo ""

            if [[ -f helm_output.txt ]]; then
              echo "<details><summary>Helm deployment</summary>"
              echo ""
              echo '```text'
              tail -n 60 helm_output.txt
              echo '```'
              echo "</details>"
            fi

            if [[ -f cluster_diagnostics.txt ]]; then
              echo ""
              echo "<details><summary>Cluster diagnostics</summary>"
              echo ""
              echo '```text'
              cat cluster_diagnostics.txt
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"