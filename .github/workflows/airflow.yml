name: Airflow CI

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-airflow:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: europe-west1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # ---------------------------------------------------------------------
      # Build + push da imagem customizada do Airflow. Roda em toda execução
      # na main (mesma lógica do dbt.yml), já que este job só é chamado
      # depois do terraform (que já roda condicionado à main via seu próprio
      # job) — mas o "needs: terraform" no main.yml não impede execução em
      # outras branches, então mantemos essa etapa sempre, e o próprio
      # deploy (helm) é que fica condicionado à main mais abaixo.
      # ---------------------------------------------------------------------
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build Airflow image
        working-directory: ./airflow
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/airflow:${{ github.sha }}"
          docker build -t "$IMAGE" .
          echo "AIRFLOW_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push Airflow image
        if: github.ref == 'refs/heads/main'
        run: docker push "$AIRFLOW_IMAGE"

      # ---------------------------------------------------------------------
      # Deploy de verdade só acontece na main — em outras branches, o job
      # para por aqui (só validou que a imagem builda sem erro).
      # ---------------------------------------------------------------------
      - name: Get GKE credentials
        if: github.ref == 'refs/heads/main'
        run: |
          gcloud container clusters get-credentials "${GCP_PROJECT_ID}-airflow-gke" \
            --region "$REGION" \
            --project "$GCP_PROJECT_ID"

      - name: Apply namespace and Kubernetes Service Account
        if: github.ref == 'refs/heads/main'
        run: |
          sed "s/PROJECT_ID/${GCP_PROJECT_ID}/" k8s/namespace-sa.yaml | kubectl apply -f -

      - name: Create ConfigMap with pipeline variables
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl create configmap airflow-pipeline-config \
            --namespace airflow \
            --from-literal=GCP_PROJECT_ID="${GCP_PROJECT_ID}" \
            --from-literal=GCS_BUCKET="${GCP_PROJECT_ID}-data-lake" \
            --from-literal=BQ_DATASET="frankfurter_dev" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create git-sync SSH secret
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl create secret generic airflow-git-ssh \
            --namespace airflow \
            --from-literal=gitSshKey="${{ secrets.SSH_PRIVATE_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Add Airflow Helm repo
        if: github.ref == 'refs/heads/main'
        run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Deploy Airflow via Helm
        if: github.ref == 'refs/heads/main'
        run: |
          helm upgrade --install airflow apache-airflow/airflow \
            --namespace airflow \
            --create-namespace \
            -f helm/airflow-values.yaml \
            --set images.airflow.repository="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/airflow" \
            --set images.airflow.tag="${{ github.sha }}" \
            --timeout 10m0s \
            --wait