name: Airflow CI

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-airflow:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: europe-west1

    steps:
      # ---------------------------------------------------------------------
      # Checkout e autenticação
      # ---------------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          install_components: gke-gcloud-auth-plugin

      - name: Verify gcloud and GKE authentication plugin
        run: |
          gcloud --version
          gke-gcloud-auth-plugin --version

      # ---------------------------------------------------------------------
      # Build e push da imagem
      # ---------------------------------------------------------------------

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      - name: Build Airflow image
        working-directory: ./airflow
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/airflow:${{ github.sha }}"

          docker build \
            --tag "$IMAGE" \
            .

          echo "AIRFLOW_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push Airflow image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "$AIRFLOW_IMAGE"

      # ---------------------------------------------------------------------
      # Conexão com o GKE
      # ---------------------------------------------------------------------

      - name: Get GKE credentials
        if: github.ref == 'refs/heads/main'
        run: |
          gcloud container clusters get-credentials \
            "${GCP_PROJECT_ID}-airflow-gke" \
            --region "$REGION" \
            --project "$GCP_PROJECT_ID"

      - name: Verify GKE connection
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ---------------------------------------------------------------------
      # Namespace e Kubernetes Service Account
      # ---------------------------------------------------------------------

      - name: Generate namespace and Service Account manifest
        if: github.ref == 'refs/heads/main'
        run: |
          sed "s/PROJECT_ID/${GCP_PROJECT_ID}/g" \
            k8s/namespace-sa.yaml \
            > /tmp/namespace-sa.yaml

          echo "===== Generated manifest ====="
          cat /tmp/namespace-sa.yaml

      - name: Validate namespace and Service Account manifest
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl apply \
            --filename /tmp/namespace-sa.yaml \
            --dry-run=client

      - name: Apply namespace and Kubernetes Service Account
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl apply \
            --filename /tmp/namespace-sa.yaml

      - name: Verify namespace and Service Account
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl get namespace airflow

          kubectl get serviceaccount airflow \
            --namespace airflow \
            --output yaml

      # ---------------------------------------------------------------------
      # ConfigMap utilizada pelas DAGs
      # ---------------------------------------------------------------------

      - name: Generate pipeline ConfigMap
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl create configmap airflow-pipeline-config \
            --namespace airflow \
            --from-literal="GCP_PROJECT_ID=${GCP_PROJECT_ID}" \
            --from-literal="GCS_BUCKET=${GCP_PROJECT_ID}-data-lake" \
            --from-literal="BQ_DATASET=frankfurter_dev" \
            --dry-run=client \
            --output=yaml \
            > /tmp/airflow-pipeline-config.yaml

          echo "===== Generated ConfigMap ====="
          cat /tmp/airflow-pipeline-config.yaml

      - name: Validate pipeline ConfigMap
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl apply \
            --filename /tmp/airflow-pipeline-config.yaml \
            --dry-run=client

      - name: Apply pipeline ConfigMap
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl apply \
            --filename /tmp/airflow-pipeline-config.yaml

      - name: Verify pipeline ConfigMap
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl get configmap airflow-pipeline-config \
            --namespace airflow \
            --output yaml

      # ---------------------------------------------------------------------
      # Helm
      # ---------------------------------------------------------------------

      - name: Add Airflow Helm repository
        if: github.ref == 'refs/heads/main'
        run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Deploy Airflow via Helm
        if: github.ref == 'refs/heads/main'
        run: |
          helm upgrade --install airflow apache-airflow/airflow \
            --namespace airflow \
            --create-namespace \
            --values helm/airflow-values.yaml \
            --set images.airflow.repository="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/airflow" \
            --set images.airflow.tag="${{ github.sha }}" \
            --timeout 20m0s \
            --wait \
            --debug

      # ---------------------------------------------------------------------
      # Diagnóstico — executa mesmo se o Helm falhar
      # ---------------------------------------------------------------------

      - name: Diagnose Airflow deployment
        if: always() && github.ref == 'refs/heads/main'
        run: |
          echo "===== Helm releases ====="
          helm list \
            --namespace airflow || true

          echo "===== Helm status ====="
          helm status airflow \
            --namespace airflow || true

          echo "===== Pods ====="
          kubectl get pods \
            --namespace airflow \
            --output wide || true

          echo "===== Deployments ====="
          kubectl get deployments \
            --namespace airflow || true

          echo "===== StatefulSets ====="
          kubectl get statefulsets \
            --namespace airflow || true

          echo "===== Jobs ====="
          kubectl get jobs \
            --namespace airflow || true

          echo "===== PersistentVolumeClaims ====="
          kubectl get pvc \
            --namespace airflow || true

          echo "===== Services ====="
          kubectl get services \
            --namespace airflow || true

          echo "===== Pod descriptions ====="
          kubectl describe pods \
            --namespace airflow || true

          echo "===== Job descriptions ====="
          kubectl describe jobs \
            --namespace airflow || true

          echo "===== Migration logs ====="
          kubectl logs \
            job/airflow-run-airflow-migrations \
            --namespace airflow \
            --all-containers \
            --tail=300 || true

          echo "===== Recent events ====="
          kubectl get events \
            --namespace airflow \
            --sort-by='.lastTimestamp' || true

      # ---------------------------------------------------------------------
      # Verificação final
      # ---------------------------------------------------------------------

      - name: Verify Airflow deployment
        if: success() && github.ref == 'refs/heads/main'
        run: |
          echo "===== Airflow pods ====="
          kubectl get pods \
            --namespace airflow \
            --output wide

          echo "===== Airflow services ====="
          kubectl get services \
            --namespace airflow

          echo "===== Airflow Helm release ====="
          helm status airflow \
            --namespace airflow