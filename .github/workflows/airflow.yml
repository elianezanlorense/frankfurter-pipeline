name: Airflow CI

on:
  workflow_call:
    secrets:
      SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy-airflow:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
      AIRFLOW_VERSION: "2.9.1"
      AIRFLOW_CHART_VERSION: "1.19.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Discover GCP resource locations
        run: |
          ARTIFACT_REGION="$(
            gcloud artifacts repositories list \
              --project "$GCP_PROJECT_ID" \
              --filter="name:dbt-images" \
              --format="value(location)" \
              --limit=1
          )"

          GKE_LOCATION="$(
            gcloud container clusters list \
              --project "$GCP_PROJECT_ID" \
              --filter="name=${GCP_PROJECT_ID}-airflow-gke" \
              --format="value(location)" \
              --limit=1
          )"

          if [[ -z "$ARTIFACT_REGION" ]]; then
            echo "Could not discover the Artifact Registry location." >&2
            exit 1
          fi

          if [[ -z "$GKE_LOCATION" ]]; then
            echo "Could not discover the GKE cluster location." >&2
            exit 1
          fi

          echo "ARTIFACT_REGION=$ARTIFACT_REGION" >> "$GITHUB_ENV"
          echo "GKE_LOCATION=$GKE_LOCATION" >> "$GITHUB_ENV"

          echo "Artifact Registry region: $ARTIFACT_REGION"
          echo "GKE location: $GKE_LOCATION"

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${ARTIFACT_REGION}-docker.pkg.dev" \
            --quiet

      - name: Build Airflow image
        working-directory: ./airflow
        run: |
          IMAGE="${ARTIFACT_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/airflow:${{ github.sha }}"

          docker build -t "$IMAGE" .

          echo "AIRFLOW_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Verify Airflow version
        run: |
          ACTUAL_VERSION="$(
            docker run --rm "$AIRFLOW_IMAGE" \
              airflow version 2>/dev/null |
              tail -n 1
          )"

          echo "Expected Airflow version: $AIRFLOW_VERSION"
          echo "Actual Airflow version:   $ACTUAL_VERSION"

          if [[ "$ACTUAL_VERSION" != "$AIRFLOW_VERSION" ]]; then
            echo "Airflow image version does not match the configured version." >&2
            exit 1
          fi

      - name: Push Airflow image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "$AIRFLOW_IMAGE"

      - name: Get GKE credentials
        if: github.ref == 'refs/heads/main'
        run: |
          gcloud container clusters get-credentials \
            "${GCP_PROJECT_ID}-airflow-gke" \
            --location "$GKE_LOCATION" \
            --project "$GCP_PROJECT_ID"

      - name: Wait for node pool to be ready
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Waiting for node pool airflow-pool..."

          STATUS=""

          for attempt in $(seq 1 30); do
            STATUS="$(
              gcloud container node-pools describe airflow-pool \
                --cluster "${GCP_PROJECT_ID}-airflow-gke" \
                --location "$GKE_LOCATION" \
                --project "$GCP_PROJECT_ID" \
                --format="value(status)" 2>/dev/null ||
                true
            )"

            echo "Attempt $attempt/30: ${STATUS:-not available}"

            if [[ "$STATUS" == "RUNNING" ]]; then
              break
            fi

            if [[ "$STATUS" == "ERROR" ]]; then
              echo "Node pool entered ERROR state." >&2
              exit 1
            fi

            sleep 20
          done

          if [[ "$STATUS" != "RUNNING" ]]; then
            echo "Node pool did not become RUNNING in time." >&2
            exit 1
          fi

          echo "Waiting for Kubernetes nodes..."

          kubectl wait \
            --for=condition=Ready \
            nodes \
            --all \
            --timeout=10m

          kubectl get nodes

      - name: Apply namespace and Kubernetes Service Account
        if: github.ref == 'refs/heads/main'
        run: |
          sed "s/PROJECT_ID/${GCP_PROJECT_ID}/" \
            k8s/namespace-sa.yaml |
            kubectl apply -f -

      - name: Create ConfigMap with pipeline variables
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl create configmap airflow-pipeline-config \
            --namespace airflow \
            --from-literal=GCP_PROJECT_ID="${GCP_PROJECT_ID}" \
            --from-literal=GCS_BUCKET="${GCP_PROJECT_ID}-data-lake" \
            --from-literal=BQ_DATASET="frankfurter_dev" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

      - name: Create git-sync SSH secret
        if: github.ref == 'refs/heads/main'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo "GitHub Secret SSH_PRIVATE_KEY is not configured." >&2
            exit 1
          fi

          umask 077

          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"

          kubectl create secret generic airflow-git-ssh \
            --namespace airflow \
            --from-file=gitSshKey="$KEY_FILE" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

      - name: Add Airflow Helm repository
        if: github.ref == 'refs/heads/main'
        run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Deploy Airflow via Helm
        if: github.ref == 'refs/heads/main'
        run: |
          helm upgrade --install airflow apache-airflow/airflow \
            --namespace airflow \
            --create-namespace \
            --version "$AIRFLOW_CHART_VERSION" \
            -f helm/airflow-values.yaml \
            --set images.airflow.repository="${ARTIFACT_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/airflow" \
            --set images.airflow.tag="${{ github.sha }}" \
            --timeout 10m0s \
            2>&1 |
            tee helm_output.txt

      - name: Collect cluster diagnostics
        if: always() && github.ref == 'refs/heads/main'
        run: |
          {
            echo "=== PODS ==="
            kubectl get pods -n airflow -o wide || true

            echo ""
            echo "=== JOBS ==="
            kubectl get jobs -n airflow || true

            echo ""
            echo "=== PVCs ==="
            kubectl get pvc -n airflow || true

            echo ""
            echo "=== EVENTS ==="
            kubectl get events \
              -n airflow \
              --sort-by='.lastTimestamp' |
              tail -40 || true

            echo ""
            echo "=== INIT CONTAINER LOGS ==="

            for pod_resource in $(kubectl get pods -n airflow -o name); do
              pod="${pod_resource#pod/}"

              echo ""
              echo "##### POD: $pod #####"

              init_containers="$(
                kubectl get pod "$pod" \
                  -n airflow \
                  -o jsonpath='{.spec.initContainers[*].name}' \
                  2>/dev/null
              )"

              if [[ -z "$init_containers" ]]; then
                echo "No init containers."
                continue
              fi

              for container in $init_containers; do
                echo ""
                echo "--- $pod / $container / CURRENT ---"

                kubectl logs "$pod" \
                  -n airflow \
                  -c "$container" \
                  --tail=100 2>&1 ||
                  true

                echo ""
                echo "--- $pod / $container / PREVIOUS ---"

                kubectl logs "$pod" \
                  -n airflow \
                  -c "$container" \
                  --previous \
                  --tail=100 2>&1 ||
                  true
              done
            done
          } > cluster_diagnostics.txt 2>&1

          cat cluster_diagnostics.txt

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Airflow deploy — summary"
            echo ""
            echo "**Project:** \`${GCP_PROJECT_ID}\`"
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo "**Airflow:** \`${AIRFLOW_VERSION}\`"
            echo "**Helm chart:** \`${AIRFLOW_CHART_VERSION}\`"
            echo "**Artifact region:** \`${ARTIFACT_REGION:-not discovered}\`"
            echo "**GKE location:** \`${GKE_LOCATION:-not discovered}\`"
            echo "**Image:** \`${AIRFLOW_IMAGE:-not built}\`"
            echo ""

            if [[ -f helm_output.txt ]]; then
              echo "<details><summary>Helm deployment</summary>"
              echo ""
              echo '```text'
              tail -n 60 helm_output.txt
              echo '```'
              echo "</details>"
            fi

            if [[ -f cluster_diagnostics.txt ]]; then
              echo ""
              echo "<details><summary>Cluster diagnostics</summary>"
              echo ""
              echo '```text'
              cat cluster_diagnostics.txt
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"