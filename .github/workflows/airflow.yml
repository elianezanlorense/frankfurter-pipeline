name: Airflow CI

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-airflow:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: europe-west1
      USE_GKE_GCLOUD_AUTH_PLUGIN: "True"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Install gke-gcloud-auth-plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build Airflow image
        working-directory: ./airflow
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/airflow:${{ github.sha }}"
          docker build -t "$IMAGE" .
          echo "AIRFLOW_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push Airflow image
        if: github.ref == 'refs/heads/main'
        run: docker push "$AIRFLOW_IMAGE"

      - name: Get GKE credentials
        if: github.ref == 'refs/heads/main'
        run: |
          gcloud container clusters get-credentials "${GCP_PROJECT_ID}-airflow-gke" \
            --region "$REGION" \
            --project "$GCP_PROJECT_ID"

      - name: Apply namespace and Kubernetes Service Account
        if: github.ref == 'refs/heads/main'
        run: |
          sed "s/PROJECT_ID/${GCP_PROJECT_ID}/" k8s/namespace-sa.yaml | kubectl apply -f -

      - name: Create ConfigMap with pipeline variables
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl create configmap airflow-pipeline-config \
            --namespace airflow \
            --from-literal=GCP_PROJECT_ID="${GCP_PROJECT_ID}" \
            --from-literal=GCS_BUCKET="${GCP_PROJECT_ID}-data-lake" \
            --from-literal=BQ_DATASET="frankfurter_dev" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create git-sync SSH secret
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl create secret generic airflow-git-ssh \
            --namespace airflow \
            --from-literal=gitSshKey="${{ secrets.SSH_PRIVATE_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Add Airflow Helm repo
        if: github.ref == 'refs/heads/main'
        run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Deploy Airflow via Helm
        if: github.ref == 'refs/heads/main'
        run: |
          helm upgrade --install airflow apache-airflow/airflow \
            --namespace airflow \
            --create-namespace \
            -f helm/airflow-values.yaml \
            --set images.airflow.repository="${REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/airflow" \
            --set images.airflow.tag="${{ github.sha }}" \
            --timeout 10m0s \
            2>&1 | tee helm_output.txt

      # -----------------------------------------------------------------
      # Roda SEMPRE (mesmo se o Helm falhar) — captura o estado real do
      # cluster no momento da falha, para não precisar caçar isso na mão
      # como aconteceu hoje.
      # -----------------------------------------------------------------
      - name: Collect cluster diagnostics
        if: always() && github.ref == 'refs/heads/main'
        run: |
          {
            echo "pods:"
            kubectl get pods -n airflow -o wide
            echo ""
            echo "events (ultimos 20):"
            kubectl get events -n airflow --sort-by='.lastTimestamp' | tail -20
            echo ""
            echo "describe dos pods que nao estao Running:"
            for pod in $(kubectl get pods -n airflow --field-selector=status.phase!=Running -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
              echo "--- $pod ---"
              kubectl describe pod "$pod" -n airflow | tail -20
            done
          } > cluster_diagnostics.txt 2>&1 || true
          cat cluster_diagnostics.txt

      - name: Write step summary
        if: always()
        run: |
          {
            echo "## Airflow deploy — resumo"
            echo ""
            echo "**Projeto:** \`${GCP_PROJECT_ID}\`"
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo "**Imagem:** \`${AIRFLOW_IMAGE:-não construída}\`"
            echo ""
            if [[ -f helm_output.txt ]]; then
              echo "<details><summary>helm upgrade --install (clique para expandir)</summary>"
              echo ""
              echo '```'
              tail -n 60 helm_output.txt
              echo '```'
              echo "</details>"
            fi
            if [[ -f cluster_diagnostics.txt ]]; then
              echo ""
              echo "<details><summary>Estado do cluster (pods, events, describe)</summary>"
              echo ""
              echo '```'
              cat cluster_diagnostics.txt
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"