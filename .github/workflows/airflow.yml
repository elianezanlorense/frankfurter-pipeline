name: Airflow CI

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-dags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get VM IP
        id: vm_ip
        run: |
          IP=$(gcloud compute instances describe airflow-vm \
              --zone=europe-west1-b \
              --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Configure SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/airflow_key
          chmod 600 /tmp/airflow_key

      - name: Wait for Airflow startup
        run: |
          for i in {1..10}; do
            if ssh -o StrictHostKeyChecking=no \
              -i /tmp/airflow_key \
              airflow@${{ steps.vm_ip.outputs.ip }} \
              "test -d /opt/airflow/dags"; then
              echo "Airflow está pronto."
              exit 0
            fi

            echo "Aguardando startup script... tentativa $i/10"
            sleep 30
          done

          echo "Airflow não ficou pronto dentro do tempo esperado."
          exit 1

      - name: Copy DAGs to VM
        run: |
          scp -o StrictHostKeyChecking=no \
              -i /tmp/airflow_key \
              airflow/dags/*.py \
              airflow@${{ steps.vm_ip.outputs.ip }}:/opt/airflow/dags/

      - name: Copy requirements to VM
        run: |
          scp -o StrictHostKeyChecking=no \
              -i /tmp/airflow_key \
              airflow/requirements.txt \
              airflow@${{ steps.vm_ip.outputs.ip }}:/opt/airflow/requirements.txt

      - name: Install DAG dependencies on VM
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i /tmp/airflow_key \
              airflow@${{ steps.vm_ip.outputs.ip }} 'bash -s' <<'REMOTE'
            source /opt/airflow/venv/bin/activate
            pip install -r /opt/airflow/requirements.txt
          REMOTE

      - name: Wait and trigger DAG
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i /tmp/airflow_key \
              airflow@${{ steps.vm_ip.outputs.ip }} 'bash -s' <<'REMOTE'
            export AIRFLOW_HOME=/opt/airflow
            source /opt/airflow/venv/bin/activate

            for i in {1..20}; do
              if airflow dags list 2>/dev/null \
                | grep -q "frankfurter_exchange_rates"; then
                airflow dags trigger frankfurter_exchange_rates
                exit 0
              fi

              echo "Aguardando DAG ser registrada... tentativa $i/20"
              sleep 15
            done

            echo "DAG não foi registrada."
            airflow dags list-import-errors
            exit 1
          REMOTE