name: Airflow CI

on:
  workflow_call:

permissions:
  contents: read
  id-token: write   # obrigatório para o WIF gerar o token OIDC

jobs:
  deploy-dags:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Get VM IP
        id: vm_ip
        run: |
          IP=$(gcloud compute instances describe airflow-vm \
            --zone=europe-west1-b \
            --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          echo "ip=$IP" >> $GITHUB_OUTPUT

      - name: Copy DAGs to VM
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/airflow_key
          chmod 600 /tmp/airflow_key
          for i in {1..10}; do
            ssh -o StrictHostKeyChecking=no -i /tmp/airflow_key \
              airflow@${{ steps.vm_ip.outputs.ip }} \
              "test -d /opt/airflow/dags" && break
            echo "Aguardando startup script... tentativa $i/10"
            sleep 30
          done
          scp -o StrictHostKeyChecking=no -i /tmp/airflow_key \
            airflow/dags/*.py \
            airflow@${{ steps.vm_ip.outputs.ip }}:/opt/airflow/dags/

      - name: Trigger DAG
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/airflow_key \
            airflow@${{ steps.vm_ip.outputs.ip }} \
            "source /opt/airflow/venv/bin/activate && \
             export AIRFLOW_HOME=/opt/airflow && \
             sleep 120 && \
             airflow dags trigger frankfurter_exchange_rates"