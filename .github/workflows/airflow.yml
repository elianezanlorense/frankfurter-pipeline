name: Airflow CI

on:
  workflow_call:
    secrets:
      SSH_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy-airflow:
    runs-on: ubuntu-latest

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
      AIRFLOW_VERSION: "2.9.1"
      AIRFLOW_CHART_VERSION: "1.19.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # ---------------------------------------------------------------------
      # Em projetos recém-criados, mesmo que o Terraform já tenha habilitado
      # container.googleapis.com, a propagação global às vezes leva mais
      # alguns minutos além do que o próprio apply consegue garantir. Sem
      # essa espera, o próximo step (Discover GCP resource locations), que
      # já chama "gcloud container clusters list", pode bater em erro 403
      # "Kubernetes Engine API has not been used ... or it is disabled",
      # mesmo a API já estando habilitada de fato.
      # ---------------------------------------------------------------------
      - name: Ensure Container API is enabled and propagated
        run: |
          gcloud services enable container.googleapis.com --project "$GCP_PROJECT_ID" --quiet

          echo "==> Aguardando propagação da API container.googleapis.com..."
          for i in $(seq 1 10); do
            if gcloud container clusters list --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
              echo "API disponível (tentativa $i/10)."
              break
            fi
            echo "Tentativa $i/10: API ainda não propagada, aguardando 15s..."
            sleep 15
          done

      - name: Discover GCP resource locations
        run: |
          GKE_LOCATION="$(
            gcloud container clusters list \
              --project "$GCP_PROJECT_ID" \
              --filter="name=${GCP_PROJECT_ID}-airflow-gke" \
              --format="value(location)" \
              --limit=1
          )"

          if [[ -z "$GKE_LOCATION" ]]; then
            echo "Could not discover the GKE cluster location." >&2
            exit 1
          fi

          if [[ "$GKE_LOCATION" =~ -[a-z]$ ]]; then
            ARTIFACT_REGION="${GKE_LOCATION%-*}"
          else
            ARTIFACT_REGION="$GKE_LOCATION"
          fi

          echo "GKE_LOCATION=$GKE_LOCATION" >> "$GITHUB_ENV"
          echo "ARTIFACT_REGION=$ARTIFACT_REGION" >> "$GITHUB_ENV"

          echo "GKE location: $GKE_LOCATION"
          echo "Artifact Registry region: $ARTIFACT_REGION"

      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${ARTIFACT_REGION}-docker.pkg.dev" \
            --quiet

      - name: Build Airflow image
        working-directory: ./airflow
        run: |
          IMAGE="${ARTIFACT_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/airflow:${{ github.sha }}"

          docker build -t "$IMAGE" .

          echo "AIRFLOW_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Verify Airflow version
        run: |
          ACTUAL_VERSION="$(
            docker run --rm "$AIRFLOW_IMAGE" \
              airflow version 2>/dev/null |
              tail -n 1
          )"

          echo "Expected Airflow version: $AIRFLOW_VERSION"
          echo "Actual Airflow version:   $ACTUAL_VERSION"

          if [[ "$ACTUAL_VERSION" != "$AIRFLOW_VERSION" ]]; then
            echo "Airflow image version does not match the configured version." >&2
            exit 1
          fi

      - name: Push Airflow image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "$AIRFLOW_IMAGE"

      - name: Get GKE credentials
        if: github.ref == 'refs/heads/main'
        run: |
          gcloud container clusters get-credentials \
            "${GCP_PROJECT_ID}-airflow-gke" \
            --location "$GKE_LOCATION" \
            --project "$GCP_PROJECT_ID"

      - name: Wait for node pool to be ready
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Waiting for node pool airflow-pool..."

          STATUS=""

          for attempt in $(seq 1 30); do
            STATUS="$(
              gcloud container node-pools describe airflow-pool \
                --cluster "${GCP_PROJECT_ID}-airflow-gke" \
                --location "$GKE_LOCATION" \
                --project "$GCP_PROJECT_ID" \
                --format="value(status)" 2>/dev/null ||
                true
            )"

            echo "Attempt $attempt/30: ${STATUS:-not available}"

            if [[ "$STATUS" == "RUNNING" ]]; then
              break
            fi

            if [[ "$STATUS" == "ERROR" ]]; then
              echo "Node pool entered ERROR state." >&2
              exit 1
            fi

            sleep 20
          done

          if [[ "$STATUS" != "RUNNING" ]]; then
            echo "Node pool did not become RUNNING in time." >&2
            exit 1
          fi

          echo "Waiting for Kubernetes nodes..."

          kubectl wait \
            --for=condition=Ready \
            nodes \
            --all \
            --timeout=10m

          kubectl get nodes

      - name: Apply namespace and Kubernetes Service Account
        if: github.ref == 'refs/heads/main'
        run: |
          sed "s/PROJECT_ID/${GCP_PROJECT_ID}/" \
            k8s/namespace-sa.yaml |
            kubectl apply -f -

      - name: Create ConfigMap with pipeline variables
        if: github.ref == 'refs/heads/main'
        run: |
          kubectl create configmap airflow-pipeline-config \
            --namespace airflow \
            --from-literal=GCP_PROJECT_ID="${GCP_PROJECT_ID}" \
            --from-literal=GCS_BUCKET="${GCP_PROJECT_ID}-data-lake" \
            --from-literal=BQ_DATASET="frankfurter_dev" \
            --from-literal=ARTIFACT_REGION="${ARTIFACT_REGION}" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

      - name: Create git-sync SSH secret
        if: github.ref == 'refs/heads/main'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [[ -z "$SSH_PRIVATE_KEY" ]]; then
            echo "GitHub Secret SSH_PRIVATE_KEY is not configured." >&2
            exit 1
          fi

          umask 077

          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"

          kubectl create secret generic airflow-git-ssh \
            --namespace airflow \
            --from-file=gitSshKey="$KEY_FILE" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

      - name: Add Airflow Helm repository
        if: github.ref == 'refs/heads/main'
        run: |
          helm repo add apache-airflow https://airflow.apache.org
          helm repo update

      - name: Deploy Airflow via Helm
        if: github.ref == 'refs/heads/main'
        run: |
          helm upgrade --install airflow apache-airflow/airflow \
            --namespace airflow \
            --create-namespace \
            --version "$AIRFLOW_CHART_VERSION" \
            -f helm/airflow-values.yaml \
            --set images.airflow.repository="${ARTIFACT_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/dbt-images/airflow" \
            --set images.airflow.tag="${{ github.sha }}" \
            --timeout 10m0s \
            2>&1 |
            tee helm_output.txt

      - name: Collect cluster diagnostics
        if: always() && github.ref == 'refs/heads/main'
        run: |
          {
            echo "=== PODS ==="
            kubectl get pods -n airflow -o wide || true

            echo ""
            echo "=== SERVICES ==="
            kubectl get services -n airflow || true

            echo ""
            echo "=== DEPLOYMENTS ==="
            kubectl get deployments -n airflow || true

            echo ""
            echo "=== STATEFULSETS ==="
            kubectl get statefulsets -n airflow || true

            echo ""
            echo "=== JOBS ==="
            kubectl get jobs -n airflow || true

            echo ""
            echo "=== PVCs ==="
            kubectl get pvc -n airflow || true

            echo ""
            echo "=== EVENTS ==="
            kubectl get events \
              -n airflow \